# =============================================================================
# General
# =============================================================================

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# Synchronized output (DEC mode 2026): batch frame updates so partial frames
# don't leak into the display. Mitigates claude-code/happy TUI duplicate-row
# redraws inside nvim :terminal. No-op on terminals that don't advertise it.
set -as terminal-features '*:Sync=2026'
set -g allow-passthrough on
set -g set-clipboard on
set -sg escape-time 10
set -g mouse on

# Propagate hostname to outer terminal title (used by Mac-side Hammerspoon
# clipboard router to pick the correct SSH host).
set -g set-titles on
set -g set-titles-string '#H'

# =============================================================================
# Prefix
# =============================================================================

set -g prefix C-p
unbind C-p
bind-key C-p send-prefix

# =============================================================================
# Key Bindings
# =============================================================================

# Reload config
unbind r
bind r source-file ~/.tmux.conf

# Split panes
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Resize panes (vim-like)
bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind -r m resize-pane -Z

# =============================================================================
# Vi Mode & Copy
# =============================================================================

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "bash -ic yank"
unbind -T copy-mode-vi MouseDragEnd1Pane

# =============================================================================
# Theme (gruvbox-material dark)
# =============================================================================

# Palette
bg0="#282828"
bg1="#32302f"
bg3="#45403d"
fg0="#d4be98"
fg1="#ddc7a1"
yellow="#d8a657"
green="#a9b665"
aqua="#89b482"
grey="#7c6f64"

# Status bar
set -g status-style "bg=$bg1,fg=$fg0"
set -g status-left "#[bg=$green,fg=$bg0,bold] #S #[bg=$bg1,fg=$green,nobold]"
set -g status-right "#[fg=$grey]%Y-%m-%d #[fg=$fg0]%H:%M #[bg=$aqua,fg=$bg0,bold] #h "
set -g status-left-length 50
set -g status-right-length 50

# Window status
set -g window-status-format "#[fg=$grey] #I:#W "
set -g window-status-current-format "#[bg=$bg3,fg=$yellow,bold] #I:#W "
set -g window-status-separator ""

# Pane
set -g pane-border-style "fg=$grey"
set -g pane-active-border-style "fg=$green"
set -g pane-border-status bottom
set -g pane-border-format "#[fg=$bg0,bg=$green,bold] #P #{pane_current_path} #[default]"
set -g window-style "bg=#1d2021"
set -g window-active-style "bg=$bg0"

# Message & Copy mode
set -g message-style "bg=$yellow,fg=$bg0"
set -g message-command-style "bg=$bg3,fg=$fg0"
set -g mode-style "bg=$bg3,fg=$fg0"

# =============================================================================
# Plugins
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'